name: DOJO Admin Web Build & Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v5

      # --------------------------------------------------
      # Setup Java
      # --------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # --------------------------------------------------
      # Setup Flutter
      # --------------------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: stable
          cache: true

      # --------------------------------------------------
      # Enable Flutter Web
      # --------------------------------------------------
      - name: Enable Flutter Web
        run: flutter config --enable-web

      # --------------------------------------------------
      # Get Dependencies
      # --------------------------------------------------
      - name: Get dependencies
        run: flutter pub get

      # --------------------------------------------------
      # Analyze
      # --------------------------------------------------
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      # --------------------------------------------------
      # Build Flutter Web
      # --------------------------------------------------
      - name: Build Web
        run: flutter build web --release

      # --------------------------------------------------
      # Upload Build Artifact
      # --------------------------------------------------
      - name: Upload Web Build
        uses: actions/upload-artifact@v4
        with:
          name: dojo-admin-web
          path: build/web

      # --------------------------------------------------
      # Setup Firebase CLI
      # --------------------------------------------------
      - name: Setup Firebase CLI
        run: |
          npm install -g firebase-tools
          firebase --version

      # --------------------------------------------------
      # Create Firebase Service Account File
      # --------------------------------------------------
      - name: Create Firebase Service Account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"

      # --------------------------------------------------
      # Deploy to Firebase Hosting
      # --------------------------------------------------
      - name: Deploy to Firebase Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          firebase deploy \
            --only hosting \
            --project dojo-platform-a5dc8
