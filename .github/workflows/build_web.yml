name: DOJO Admin Web Build & Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout
      - name: Checkout
        uses: actions/checkout@v5

      # Setup Java
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      # Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: stable
          cache: true

      # Enable Flutter Web
      - name: Enable Flutter Web
        run: flutter config --enable-web

      # Get Dependencies
      - name: Get dependencies
        run: flutter pub get

      # Analyze
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # Build Flutter Web
      - name: Build Web
        run: flutter build web --release

      # Verify Web Build
      - name: Verify Web Build
        run: |
          if [ ! -d "build/web" ]; then
            echo "ERROR: build/web directory was not created."
            exit 1
          fi

          if [ ! -f "build/web/index.html" ]; then
            echo "ERROR: build/web/index.html was not created."
            exit 1
          fi

          echo "Flutter Web build verified successfully."
          du -sh build/web

      # Check Firebase Hosting Configuration
      - name: Check Firebase configuration
        run: |
          if [ ! -f firebase.json ]; then
            echo "ERROR: firebase.json was not found in repository root."
            exit 1
          fi

          echo "firebase.json found."
          cat firebase.json

      # Setup Firebase CLI
      - name: Setup Firebase CLI
        run: |
          npm install -g firebase-tools
          firebase --version

      # Create Firebase Service Account
      - name: Create Firebase Service Account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "ERROR: FIREBASE_SERVICE_ACCOUNT secret is missing."
            exit 1
          fi

          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" \
            > "$RUNNER_TEMP/firebase-service-account.json"

          echo "Firebase service account file created."

      # Deploy to Firebase Hosting
      - name: Deploy to Firebase Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          firebase deploy \
            --only hosting \
            --project dojo-platform-a5dc8

      # Upload Web Build
      - name: Upload Web Build
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: dojo-admin-web
          path: build/web
          if-no-files-found: error
          compression-level: 6
          retention-days: 7

      # Cleanup Service Account
      - name: Cleanup Firebase Service Account
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/firebase-service-account.json"
          echo "Firebase service account file removed."
