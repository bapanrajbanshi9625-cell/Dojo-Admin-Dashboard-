name: DOJO Admin Web Build & Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v5

      # --------------------------------------------------
      # Setup Java
      # --------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # --------------------------------------------------
      # Setup Flutter
      # --------------------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: stable
          cache: true

      # --------------------------------------------------
      # Enable Flutter Web
      # --------------------------------------------------
      - name: Enable Flutter Web
        run: flutter config --enable-web

      # --------------------------------------------------
      # Get Dependencies
      # --------------------------------------------------
      - name: Get dependencies
        run: flutter pub get

      # --------------------------------------------------
      # Analyze
      # Warnings and infos will NOT fail CI.
      # Real analyzer errors will still fail CI.
      # --------------------------------------------------
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # --------------------------------------------------
      # Build Flutter Web
      # --------------------------------------------------
      - name: Build Web
        run: flutter build web --release

      # --------------------------------------------------
      # Check Firebase Hosting Configuration
      # --------------------------------------------------
      - name: Check Firebase configuration
        run: |
          if [ ! -f firebase.json ]; then
            echo "ERROR: firebase.json was not found in the repository root."
            exit 1
          fi

          echo "firebase.json found."
          cat firebase.json

      # --------------------------------------------------
      # Upload Web Build
      # --------------------------------------------------
      - name: Upload Web Build
        uses: actions/upload-artifact@v4
        with:
          name: dojo-admin-web
          path: build/web

      # --------------------------------------------------
      # Setup Firebase CLI
      # --------------------------------------------------
      - name: Setup Firebase CLI
        run: |
          npm install -g firebase-tools
          firebase --version

      # --------------------------------------------------
      # Create Firebase Service Account
      # --------------------------------------------------
      - name: Create Firebase Service Account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "ERROR: FIREBASE_SERVICE_ACCOUNT secret is missing."
            exit 1
          fi

          echo "$FIREBASE_SERVICE_ACCOUNT" \
            > "$RUNNER_TEMP/firebase-service-account.json"

          echo "Firebase service account file created."

      # --------------------------------------------------
      # Deploy to Firebase Hosting
      # --------------------------------------------------
      - name: Deploy to Firebase Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          firebase deploy \
            --only hosting \
            --project dojo-platform-a5dc8

      # --------------------------------------------------
      # Remove Service Account
      # --------------------------------------------------
      - name: Cleanup Firebase Service Account
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/firebase-service-account.json"
          echo "Firebase service account file removed."
